name: GitHub NetMod شسيش1شي

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Xray Core & Cloudflared
        shell: powershell
        run: |
          # 1. تنزيل Xray Core
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath ".\xray" -Force
          
          # 2. تنزيل cloudflared لنفق ثابت وبدون حماية
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Configure & Start Xray Server
        shell: powershell
        run: |
          $xrayConfig = @"
          {
            "inbounds": [{
              "port": 8080,
              "protocol": "vmess",
              "settings": {
                "clients": [{"id": "ad182fa2-8e10-431f-9988-123456789abc", "alterId": 0}]
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {"path": "/"}
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          "@
          Set-Content -Path ".\xray\config.json" -Value $xrayConfig
          Start-Process -FilePath ".\xray\xray.exe" -ArgumentList "run -config .\xray\config.json" -NoNewWindow

      - name: Start Cloudflare Tunnel & Generate VMess Link
        shell: powershell
        run: |
          # تشغيل cloudflared لتوجيه الترافيك لبورت 8080
          $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:8080" -RedirectStandardError "cloudflared.log" -PassThru -NoNewWindow
          
          Start-Sleep -Seconds 12
          
          $logContent = Get-Content "cloudflared.log" -Raw
          
          # استخراج دومين cloudflare المؤقت
          if ($logContent -match 'https://([a-zA-Z0-9-]+\.trycloudflare\.com)') {
              $domain = $matches[1]
              
              # بناء كود VMess جاهز لـ NetMod مع هوست speedtest.net
              $vmessJson = @{
                  v    = "2"
                  ps   = "GitHub-Cloudflare-Server"
                  add  = $domain
                  port = "443"
                  id   = "ad182fa2-8e10-431f-9988-123456789abc"
                  aid  = "0"
                  scy  = "auto"
                  net  = "ws"
                  type = "none"
                  host = "speedtest.net"
                  path = "/"
                  tls  = "tls"
                  sni  = $domain
              } | ConvertTo-Json -Compress
              
              $bytes  = [System.Text.Encoding]::UTF8.GetBytes($vmessJson)
              $base64 = [Convert]::ToBase64String($bytes)
              $vmessLink = "vmess://$base64"
              
              Write-Host "====================================================" -ForegroundColor Green
              Write-Host " [+] WORKING VMESS LINK FOR NETMOD:" -ForegroundColor Yellow
              Write-Host " $vmessLink" -ForegroundColor Cyan
              Write-Host "====================================================" -ForegroundColor Green
          } else {
              Write-Host "[-] Failed to fetch Cloudflare domain. Raw Output:" -ForegroundColor Red
              Write-Host $logContent
          }

      - name: Keep Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
