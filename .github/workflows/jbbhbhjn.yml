name: AAA_Test_Win 11

on:
  workflow_dispatch: # تفعيل خيار التشغيل اليدوي Run workflow

jobs:
  start-server:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. تثبيت وتشغيل أداة النفق (Cloudflare Tunnel كمثال لفتح بورت)
      - name: Install & Run Cloudflare Tunnel
        shell: powershell
        run: |
          Invoke-WebRequest -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
          # يمكنك استخدام Token الخاص بنطاقك sg5.taskflowhub.org هنا
          # Start-Process -FilePath .\cloudflared.exe -ArgumentList "tunnel --no-autoupdate run --token YOUR_TUNNEL_TOKEN" -NoNewWindow

      # 2. تشغيل السيرفر أو السكريبت الخاص بك (Xray / Python / Custom Proxy)
      - name: Run Server Executable
        shell: powershell
        run: |
          # استبدل هذا الأمر بمسار تشغيل برنامجك
          # Start-Process -FilePath .\xray.exe -ArgumentList "-config config.json" -NoNewWindow
          echo "Server is running..."

      # 3. إبقاء الـ Runner حياً حتى أقصى حد مسموح (6 ساعات)
      - name: Keep Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
