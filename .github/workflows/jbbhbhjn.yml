name: GitHub NetMod142

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Xray Core & tmole
        shell: powershell
        run: |
          # تنزيل وفك ضغط Xray Core
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath ".\xray" -Force
          
          # تنزيل أداة tmole للأنفاق المباشرة
          Invoke-WebRequest -Uri "https://i.jpillora.com/tmole-win-amd64.gz" -OutFile "tmole.gz"
          # فك ضغط tmole
          $gzipStream = New-Object System.IO.Compression.GZipStream((New-Object System.IO.FileStream("tmole.gz", [System.IO.FileMode]::Open)), [System.IO.Compression.CompressionMode]::Decompress)
          $outputStream = New-Object System.IO.FileStream("tmole.exe", [System.IO.FileMode]::Create)
          $gzipStream.CopyTo($outputStream)
          $outputStream.Close()
          $gzipStream.Close()

      - name: Configure & Start Xray Server
        shell: powershell
        run: |
          # إنشاء إعدادات Xray
          $xrayConfig = @"
          {
            "inbounds": [{
              "port": 1080,
              "protocol": "vmess",
              "settings": {
                "clients": [{"id": "ad182fa2-8e10-431f-9988-123456789abc", "alterId": 0}]
              },
              "streamSettings": {
                "network": "tcp"
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          "@
          Set-Content -Path ".\xray\config.json" -Value $xrayConfig
          Start-Process -FilePath ".\xray\xray.exe" -ArgumentList "run -config .\xray\config.json" -NoNewWindow

      - name: Start TCP Tunnel & Generate NetMod VMess Link
        shell: powershell
        run: |
          # تشغيل tmole وحفظ مخرجات الاتصال
          $process = Start-Process -FilePath ".\tmole.exe" -ArgumentList "1080" -RedirectStandardOutput "tmole.log" -PassThru -NoNewWindow
          
          Start-Sleep -Seconds 10
          
          $logContent = Get-Content "tmole.log" -Raw
          
          # استخراج العنوان والبورت المباشر
          if ($logContent -match "https?://([^:]+):?(\d+)?") {
              # في حال تم استخراج الـ Domain والـ Port
              $domain = $matches[1]
              $port = if ($matches[2]) { $matches[2] } else { "80" }
              
              # بناء كود VMess
              $vmessJson = @{
                  v    = "2"
                  ps   = "GitHub-NetMod-Server"
                  add  = $domain
                  port = $port
                  id   = "ad182fa2-8e10-431f-9988-123456789abc"
                  aid  = "0"
                  scy  = "auto"
                  net  = "tcp"
                  type = "none"
                  host = ""
                  path = ""
                  tls  = "none"
                  sni  = ""
              } | ConvertTo-Json -Compress
              
              $bytes  = [System.Text.Encoding]::UTF8.GetBytes($vmessJson)
              $base64 = [Convert]::ToBase64String($bytes)
              $vmessLink = "vmess://$base64"
              
              Write-Host "====================================================" -ForegroundColor Green
              Write-Host " [+] READY & WORKING VMESS LINK FOR NETMOD:" -ForegroundColor Yellow
              Write-Host " $vmessLink" -ForegroundColor Cyan
              Write-Host "====================================================" -ForegroundColor Green
          } else {
              Write-Host "[-] Tunnel Output Logs:" -ForegroundColor Red
              Write-Host $logContent
          }

      - name: Keep Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
