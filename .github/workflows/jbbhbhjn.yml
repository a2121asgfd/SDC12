name: GitHub NetMovps

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Xray Core & Install LocalTunnel
        shell: powershell
        run: |
          # 1. تنزيل Xray Core
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath ".\xray" -Force
          
          # 2. تثبيت localtunnel
          npm install -g localtunnel

      - name: Configure & Start Xray Server
        shell: powershell
        run: |
          $xrayConfig = @"
          {
            "inbounds": [{
              "port": 8080,
              "protocol": "vmess",
              "settings": {
                "clients": [{"id": "ad182fa2-8e10-431f-9988-123456789abc", "alterId": 0}]
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {"path": "/"}
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          "@
          Set-Content -Path ".\xray\config.json" -Value $xrayConfig
          Start-Process -FilePath ".\xray\xray.exe" -ArgumentList "run -config .\xray\config.json" -NoNewWindow

      - name: Start Tunnel & Generate NetMod VMess Link
        shell: powershell
        run: |
          # تشغيل npx عبر cmd.exe لتفادي خطأ Win32 application
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c npx localtunnel --port 8080" -RedirectStandardOutput "lt.log" -PassThru -NoNewWindow
          
          Start-Sleep -Seconds 12
          
          $logContent = Get-Content "lt.log" -Raw
          
          # استخراج النطاق
          if ($logContent -match 'https://([a-zA-Z0-9-]+\.loca\.lt)') {
              $domain = $matches[1]
              
              # بناء كود VMess المخصص لـ NetMod
              $vmessJson = @{
                  v    = "2"
                  ps   = "GitHub-NetMod-Server"
                  add  = $domain
                  port = "443"
                  id   = "ad182fa2-8e10-431f-9988-123456789abc"
                  aid  = "0"
                  scy  = "auto"
                  net  = "ws"
                  type = "none"
                  host = $domain
                  path = "/"
                  tls  = "tls"
                  sni  = $domain
              } | ConvertTo-Json -Compress
              
              $bytes  = [System.Text.Encoding]::UTF8.GetBytes($vmessJson)
              $base64 = [Convert]::ToBase64String($bytes)
              $vmessLink = "vmess://$base64"
              
              Write-Host "====================================================" -ForegroundColor Green
              Write-Host " [+] READY & WORKING VMESS LINK FOR NETMOD:" -ForegroundColor Yellow
              Write-Host " $vmessLink" -ForegroundColor Cyan
              Write-Host "====================================================" -ForegroundColor Green
          } else {
              Write-Host "[-] Failed to parse LocalTunnel domain. Raw output:" -ForegroundColor Red
              Write-Host $logContent
          }

      - name: Keep Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
